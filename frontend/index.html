<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4"><div class="container">
  <a class="navbar-brand" href="/">JobMatch AI</a>
  <a class="btn btn-light btn-sm" href="/dashboard.html">Dashboard</a>
</div></nav>

<div class="container">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card p-3" id="authBox">
        <ul class="nav nav-pills mb-3">
          <li class="nav-item"><button class="nav-link active" data-mode="login">Login</button></li>
          <li class="nav-item"><button class="nav-link" data-mode="register">Daftar</button></li>
        </ul>
        <input id="name" class="form-control mb-2 d-none" placeholder="Nama">
        <input id="email" type="email" class="form-control mb-2" placeholder="Email">
        <input id="password" type="password" class="form-control mb-2" placeholder="Password">
        <select id="role" class="form-select mb-2 d-none">
          <option value="student">Student</option><option value="company">Company</option>
        </select>
        <input id="skills" class="form-control mb-2 d-none" placeholder="Skills (cth: python, sql, html)">
        <button id="authBtn" class="btn btn-primary w-100">Login</button>
        <div id="authMsg" class="text-danger small mt-2"></div>
      </div>
    </div>
    <div class="col-md-8">
      <input id="search" class="form-control mb-3" placeholder="Cari job / skill / lokasi...">
      <div id="jobList" class="row g-3"></div>
    </div>
  </div>
</div>
<script src="/js/main.js"></script>
<script>initHome();</script>
</body>
</html>
